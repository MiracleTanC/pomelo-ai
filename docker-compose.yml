# 基础设施：Milvus 3.0.x (etcd + minio) + MySQL 8 + Redis 7
# 启动：docker compose up -d
#
# 镜像拉取：国内拉 docker.io 直连经常失败，这里统一走「渡渡鸟镜像同步站」
# 同步到的华为云 SWR 仓库（支持匿名 pull，无需 docker login）。前缀格式：
#   docker.io/library/mysql:8.0   ->  swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
#   docker.io/minio/minio:xxx      ->  swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:xxx
#   docker.io/milvusdb/milvus:xxx  ->  swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:xxx
#   docker.io/library/redis:xxx    ->  swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:xxx
#   quay.io/coreos/etcd:xxx        ->  quay.io/coreos/etcd:xxx（quay 直连正常，无需改）
# 注：渡渡鸟只同步了部分 tag，若某 tag 返回 not found，换同版本近期 tag 或去
#     https://docker.aityp.com 搜索可用 tag。当前 compose 用的 tag 均已验证可用。
# 因此本 compose 不依赖 daemon.json 的 registry-mirrors 配置即可稳定拉取。
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pomelo-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/docker/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: pomelo-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./data/docker/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v3.0.0
    container_name: pomelo-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/docker/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: pomelo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pomelo_ai
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./data/docker/mysql:/var/lib/mysql

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7-alpine
    container_name: pomelo-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/docker/redis:/data

  attu:
    # Milvus 图形化管理台（类似 MySQL 的 Navicat）
    # 浏览器访问 http://localhost:3000，连接地址已预填 milvus:19530
    # v3.0.0 变化：环境变量 MILVUS_ADDRESS（非 MILVUS_URL）；默认开启本地登录认证
    # 本地开发关闭认证（ATTU_AUTH_MODE=none），生产环境改 ATTU_ADMIN_USER/PASSWORD
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zilliz/attu:v3.0.0
    container_name: pomelo-attu
    environment:
      MILVUS_ADDRESS: milvus:19530
      ATTU_AUTH_MODE: "none"
    ports:
      - "3000:3000"
    volumes:
      - ./data/docker/attu:/data
    depends_on:
      - milvus

# 数据卷：绑定挂载到项目目录 ./data/docker/ 下，Windows 磁盘上可直接看到/备份。
# down -v 不删数据（数据在宿主机目录，不受 Docker 卷生命周期影响）。
# .gitignore 已忽略 ./data/，不会提交到仓库。
volumes: {}
