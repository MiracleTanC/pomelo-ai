# ==================== 公共配置（所有环境完全相同，零秘钥） ====================
server:
  port: 8080

spring:
  application:
    name: pomelo-ai
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

pomelo:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

  # ---- LLM 通用参数（provider 和秘钥在 dev/release 中） ----
  llm:
    temperature: 0.7
    max-tokens: 2048
    timeout-seconds: 120

  # ---- Milvus 连接（各环境相同） ----
  milvus:
    host: localhost
    port: 19530
    collection-prefix: pomelo_

  # ---- MinerU 公共配置（api-key 在 dev/release 中） ----
  mineru:
    enabled: true
    mode: cloud
    local:
      base-url: http://localhost:8000
    cloud:
      base-url: https://mineru.net/api/v4
      model-version: vlm
    tier: standard
    timeout-seconds: 600

  # ---- 切片 ----
  chunk:
    size: 500
    overlap: 50

  # ---- RAG ----
  rag:
    top-k: 8
    rerank-top-k: 4
    max-iterations: 3

  # ---- 认证公共部分（密码在 dev/release 中） ----
  auth:
    username: admin
    token-ttl-minutes: 720

logging:
  level:
    org.pomelo: INFO
    dev.langchain4j: WARN

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.pomelo.domain
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
